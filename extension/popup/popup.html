<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>RUAI</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/ruai.css" />
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="ruai-root pop">
    <header class="pop-head">
      <div class="pop-brand">
        <span class="pop-mark" id="brand-mark"></span>
        <div>
          <h1>RUAI</h1>
          <p>Is this real?</p>
        </div>
      </div>
    </header>

    <main class="pop-body">
      <section class="pop-status" id="status" data-state="checking">
        <span class="pop-status-dot"></span>
        <div>
          <div class="pop-status-title" id="status-title">Checking the connection…</div>
          <div class="pop-status-note" id="status-note">One moment.</div>
        </div>
      </section>

      <section class="pop-card">
        <h2 class="pop-card-title">What RUAI is watching</h2>

        <label class="pop-toggle">
          <span>
            <span class="pop-toggle-label">Videos</span>
            <span class="pop-toggle-note">Adds a check button on YouTube and Facebook.</span>
          </span>
          <input type="checkbox" id="toggle-video" />
          <span class="pop-switch" aria-hidden="true"></span>
        </label>

        <label class="pop-toggle">
          <span>
            <span class="pop-toggle-label">Messages</span>
            <span class="pop-toggle-note">Warns you about scam messages as they arrive.</span>
          </span>
          <input type="checkbox" id="toggle-message" />
          <span class="pop-switch" aria-hidden="true"></span>
        </label>
      </section>

      <section class="pop-stats" id="stats" hidden>
        <div class="pop-stat">
          <span class="pop-stat-value" id="stat-checks">0</span>
          <span class="pop-stat-label">Checks made</span>
        </div>
        <div class="pop-stat">
          <span class="pop-stat-value" id="stat-warnings">0</span>
          <span class="pop-stat-label">Warnings</span>
        </div>
      </section>

      <button type="button" class="ruai-btn ruai-btn-primary pop-wide" id="open-dashboard">
        See everything RUAI has checked
      </button>

      <details class="pop-advanced">
        <summary>Settings</summary>
        <label class="pop-field" for="backend-url">Address of the RUAI checker</label>
        <input type="url" id="backend-url" spellcheck="false" placeholder="http://localhost:8000" />
        <button type="button" class="ruai-btn ruai-btn-quiet pop-wide" id="save-url">Save</button>
        <p class="pop-hint" id="save-hint" role="status"></p>
      </details>
    </main>

    <footer class="pop-foot">
      RUAI never sends what you look at anywhere except your own checker.
    </footer>
  </div>

  <script src="../shared/config.js"></script>
  <script src="../shared/api.js"></script>
  <script src="popup.js"></script>
</body>

</html>
