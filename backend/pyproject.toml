[tool.pytest.ini_options]
# Modules import each other as top-level packages (`from core.verdict import …`),
# matching how uvicorn runs the app from this directory.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
